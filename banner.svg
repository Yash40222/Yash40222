<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Dark Purple Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A032A" />
      <stop offset="50%" stop-color="#3B0754" />
      <stop offset="100%" stop-color="#1A032A" />
    </linearGradient>

    <!-- Dome Arc Radial Gradient -->
    <radialGradient id="domeGrad" cx="50%" cy="100%" r="75%">
      <stop offset="0%" stop-color="#D946EF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#A855F7" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#581C87" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1A032A" stop-opacity="0" />
    </radialGradient>

    <!-- Avatar Clip Path -->
    <clipPath id="avatarClip">
      <circle cx="600" cy="90" r="42" />
    </clipPath>
  </defs>

  <!-- Base Outer Background -->
  <rect width="1200" height="320" fill="url(#bgGrad)" rx="8" />

  <!-- Dome Arch Path -->
  <path d="M 120 320 A 480 310 0 0 1 1080 320 Z" fill="url(#domeGrad)" />

  <!-- Top Center User Avatar Badge -->
  <circle cx="600" cy="90" r="47" fill="#1A032A" stroke="#E879F9" stroke-width="3" />
  <image href="https://github.com/Yash40222.png" x="558" y="48" width="84" height="84" clip-path="url(#avatarClip)" />

  <!-- Main Title Text -->
  <text x="600" y="185" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="8">HELLO WORLD</text>

  <!-- Subtitle Text -->
  <text x="600" y="222" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14" fill="#F472B6" letter-spacing="4">WELCOME TO MY PROFILE</text>

</svg>
